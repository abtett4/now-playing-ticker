<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing Ticker</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #111318; font-family: system-ui, sans-serif; color: #f4f4f6; }
  .intro { max-width: 720px; margin: 0 auto 16px; }
  .intro h1 { margin: 0 0 8px; font-size: 24px; }
  .intro p { margin: 0; font-size: 15px; line-height: 1.5; color: #c9c9d1; }

  /* ---- Portfolio embed: copy from here ---- */
  .now-playing { max-width: 720px; margin: 0 auto; padding: 16px; background: #000000; border-radius: 12px; }
  .now-playing canvas { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<header class="intro">
  <h1>Now Playing</h1>
  <p>What I'm listening to on Spotify right now, drawn like the LED matrix ticker on my Raspberry Pi. When nothing is playing, it shows the time.</p>
</header>

<div class="now-playing" id="now-playing" role="img" aria-label="Now playing"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js" integrity="sha512-d6sc8kbZEtA2LwB9m/ck0FhvyUwVfdmvTeyJRprmj7Wg9wRFtHDIpr6qk4g/y3Ix3O9I6KHIv6SGu9f7RaP1Gw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="ticker.js"></script>
<!-- ---- Portfolio embed: copy to here ---- -->
</body>
</html>
