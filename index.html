<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Now Playing Ticker</title>
<style>
  body { margin: 0; padding: 32px 16px; background: #111318; font-family: system-ui, sans-serif; color: #f4f4f6; }
  .intro { max-width: 720px; margin: 0 auto 16px; }
  .intro h1 { margin: 0 0 8px; font-size: 24px; }
  .intro p { margin: 0; font-size: 15px; line-height: 1.5; color: #c9c9d1; }

  /* ---- Portfolio embed: copy from here ---- */
  .now-playing { max-width: 720px; margin: 0 auto; padding: 16px; background: #000000; border-radius: 12px; }
  .now-playing canvas { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
<header class="intro">
  <h1>Now Playing</h1>
  <p>What I'm listening to on Spotify right now, drawn like the LED matrix ticker on my Raspberry Pi. When nothing is playing, it shows the time.</p>
</header>

<div class="now-playing" id="now-playing" role="img" aria-label="Now playing"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js" integrity="sha512-d6sc8kbZEtA2LwB9m/ck0FhvyUwVfdmvTeyJRprmj7Wg9wRFtHDIpr6qk4g/y3Ix3O9I6KHIv6SGu9f7RaP1Gw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(() => {
  const RELAY_URL = "https://now-playing-relay.abtett4.workers.dev/now-playing";  // the Cloudflare Worker's /now-playing address
  const ART_HOST = "https://i.scdn.co/";      // only accept album art from Spotify's image server
  const POLL_SECONDS = 15;

  const ART_DOTS = 24;        // album art is drawn as a 24 x 24 grid of LEDs
  const ROWS = 11;            // marquee height in LEDs
  const SCROLL_SPEED = 0.4;   // LEDs per frame
  const BG = "#000000";  // keep in sync with the CSS above
  const LED_ON = "#ff3b30", LED_OFF = "#2a1210", ART_OFF = "#1c1c1f";

  // The Raspberry Pi ticker's font: CP437_FONT from luma.core (MIT licence,
  // (c) 2017-2021 Richard Hull and contributors). 8 column bytes per character, bit 0 = top row.
  // Covers the music note "\x0e" (♫) and printable ASCII " " to "~".
  const NOTE = "\x0e";
  const FONT_CHARS = NOTE + Array.from({ length: 95 }, (_, i) => String.fromCharCode(32 + i)).join("");
  const FONT_DATA = (
    "c0ff7f0505657f3f000000000000000000065f5f060000000007070007070000147f7f147f7f1400242e6b6b3a120000466630180c666200307a4f5d377a4800" +
    "0407030000000000001c3e63410000000041633e1c000000082a3e1c1c3e2a0808083e3e080800000080e0600000000008080808080800000000606000000000" +
    "6030180c060301003e7f71594d7f3e0040427f7f40400000627359496f660000226349497f360000181c16537f7f5000276745457d3900003c7e4b4979300000" +
    "030371790f070000367f49497f360000064f49693f1e000000006666000000000080e66600000000081c3663410000002424242424240000004163361c080000" +
    "020351590f0600003e7f415d5d1f1e007c7e13137e7c0000417f7f49497f36001c3e634141632200417f7f41633e1c00417f7f495d416300417f7f491d010300" +
    "1c3e6341517372007f7f08087f7f000000417f7f41000000307040417f3f0100417f7f081c776300417f7f41406070007f7f0e1c0e7f7f007f7f060c187f7f00" +
    "1c3e6341633e1c00417f7f49090f06001e3f21717f5e0000417f7f09197f6600266f4d597332000003417f7f410300007f7f40407f7f00001f3f60603f1f0000" +
    "7f7f3018307f7f0043673c183c674300074f78784f070000476371594d677300007f7f41410000000103060c183060000041417f7f000000080c0603060c0800" +
    "80808080808080800000030704000000207454543c784000417f3f4848783000387c44446c280000307848493f7f4000387c54545c180000487e7f4903020000" +
    "98bca4a4f87c0400417f7f08047c780000447d7d4000000060e08080fd7d0000417f7f10386c440000417f7f400000007c7c18381c7c78007c7c04047c780000" +
    "387c44447c38000084fcf8a4243c1800183c24a4f8fc8400447c784c041c1800485c54547424000000043e7f442400003c7c40403c7c40001c3c60603c1c0000" +
    "3c7c7038707c3c00446c3810386c44009cbca0a0fc7c00004c64745c4c64000008083e774141000000000077770000004141773e080800000203010302030100"
  ).match(/.{16}/g);
  // Letters and punctuation that don't break down into plain ASCII, so toAscii would otherwise drop them:
  // special Latin letters, punctuation, Cyrillic, Greek and Korean. A copy of ticker/spellings.json;
  // web/check-ticker-text.mjs checks the two match.
  const SPELLINGS = {
    "\u0131": "i", "\u00f8": "o", "\u00d8": "O", "\u00e6": "ae", "\u00c6": "AE", "\u0153": "oe", "\u0152": "OE", "\u00df": "ss", "\u0142": "l", "\u0141": "L",
    "\u0111": "d", "\u0110": "D", "\u00f0": "d", "\u00d0": "D", "\u00fe": "th", "\u00de": "Th", "\u2019": "'", "\u2018": "'", "\u201a": "'", "\u2039": "'",
    "\u203a": "'", "\u201c": "\"", "\u201d": "\"", "\u201e": "\"", "\u00ab": "\"", "\u00bb": "\"", "\u2010": "-", "\u2011": "-", "\u2013": "-", "\u2014": "-",
    "\u2212": "-", "\u00d7": "x", "\u266f": "#", "\u266d": "b", "\u2044": "/", "\u0430": "a", "\u0410": "A", "\u0431": "b", "\u0411": "B", "\u0432": "v",
    "\u0412": "V", "\u0433": "g", "\u0413": "G", "\u0434": "d", "\u0414": "D", "\u0435": "e", "\u0415": "E", "\u0436": "zh", "\u0416": "Zh", "\u0437": "z",
    "\u0417": "Z", "\u0438": "i", "\u0418": "I", "\u043a": "k", "\u041a": "K", "\u043b": "l", "\u041b": "L", "\u043c": "m", "\u041c": "M", "\u043d": "n",
    "\u041d": "N", "\u043e": "o", "\u041e": "O", "\u043f": "p", "\u041f": "P", "\u0440": "r", "\u0420": "R", "\u0441": "s", "\u0421": "S", "\u0442": "t",
    "\u0422": "T", "\u0443": "u", "\u0423": "U", "\u0444": "f", "\u0424": "F", "\u0445": "kh", "\u0425": "Kh", "\u0446": "ts", "\u0426": "Ts", "\u0447": "ch",
    "\u0427": "Ch", "\u0448": "sh", "\u0428": "Sh", "\u0449": "shch", "\u0429": "Shch", "\u044b": "y", "\u042b": "Y", "\u044d": "e", "\u042d": "E", "\u044e": "yu",
    "\u042e": "Yu", "\u044f": "ya", "\u042f": "Ya", "\u0451": "yo", "\u0401": "Yo", "\u0439": "y", "\u0419": "Y", "\u044a": "", "\u042a": "", "\u044c": "",
    "\u042c": "", "\u0456": "i", "\u0406": "I", "\u0457": "yi", "\u0407": "Yi", "\u0454": "ye", "\u0404": "Ye", "\u0491": "g", "\u0490": "G", "\u045e": "u",
    "\u040e": "U", "\u0452": "dj", "\u0402": "Dj", "\u0458": "j", "\u0408": "J", "\u0459": "lj", "\u0409": "Lj", "\u045a": "nj", "\u040a": "Nj", "\u045b": "c",
    "\u040b": "C", "\u045f": "dz", "\u040f": "Dz", "\u0453": "gj", "\u0403": "Gj", "\u045c": "kj", "\u040c": "Kj", "\u0455": "dz", "\u0405": "Dz", "\u03b1": "a",
    "\u0391": "A", "\u03b2": "v", "\u0392": "V", "\u03b3": "g", "\u0393": "G", "\u03b4": "d", "\u0394": "D", "\u03b5": "e", "\u0395": "E", "\u03b6": "z",
    "\u0396": "Z", "\u03b7": "i", "\u0397": "I", "\u03b8": "th", "\u0398": "Th", "\u03b9": "i", "\u0399": "I", "\u03ba": "k", "\u039a": "K", "\u03bb": "l",
    "\u039b": "L", "\u03bc": "m", "\u039c": "M", "\u03bd": "n", "\u039d": "N", "\u03be": "x", "\u039e": "X", "\u03bf": "o", "\u039f": "O", "\u03c0": "p",
    "\u03a0": "P", "\u03c1": "r", "\u03a1": "R", "\u03c3": "s", "\u03a3": "S", "\u03c4": "t", "\u03a4": "T", "\u03c5": "y", "\u03a5": "Y", "\u03c6": "f",
    "\u03a6": "F", "\u03c7": "ch", "\u03a7": "Ch", "\u03c8": "ps", "\u03a8": "Ps", "\u03c9": "o", "\u03a9": "O", "\u03c2": "s", "\u03bf\u03c5": "ou", "\u039f\u03c5": "Ou",
    "\u039f\u03a5": "OU", "\u1100": "g", "\u1101": "kk", "\u1102": "n", "\u1103": "d", "\u1104": "tt", "\u1105": "r", "\u1106": "m", "\u1107": "b", "\u1108": "pp",
    "\u1109": "s", "\u110a": "ss", "\u110b": "", "\u110c": "j", "\u110d": "jj", "\u110e": "ch", "\u110f": "k", "\u1110": "t", "\u1111": "p", "\u1112": "h",
    "\u1161": "a", "\u1162": "ae", "\u1163": "ya", "\u1164": "yae", "\u1165": "eo", "\u1166": "e", "\u1167": "yeo", "\u1168": "ye", "\u1169": "o", "\u116a": "wa",
    "\u116b": "wae", "\u116c": "oe", "\u116d": "yo", "\u116e": "u", "\u116f": "wo", "\u1170": "we", "\u1171": "wi", "\u1172": "yu", "\u1173": "eu", "\u1174": "ui",
    "\u1175": "i", "\u11a8": "k", "\u11a9": "k", "\u11aa": "k", "\u11ab": "n", "\u11ac": "n", "\u11ad": "n", "\u11ae": "t", "\u11af": "l", "\u11b0": "k",
    "\u11b1": "m", "\u11b2": "l", "\u11b3": "l", "\u11b4": "l", "\u11b5": "p", "\u11b6": "l", "\u11b7": "m", "\u11b8": "p", "\u11b9": "p", "\u11ba": "t",
    "\u11bb": "t", "\u11bc": "ng", "\u11bd": "t", "\u11be": "t", "\u11bf": "k", "\u11c0": "t", "\u11c1": "p", "\u11c2": "t",
  };
  const SPELLING_PATTERN = new RegExp(Object.keys(SPELLINGS).sort((a, b) => b.length - a.length)
    .map((k) => k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|"), "g");
  // Japanese and Chinese can't be spelled out without a dictionary, so these are drawn
  // from the visitor's own fonts instead (web only; the Pi ticker leaves them out)
  const CJK = /([\u3001-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff66-\uff9f]+)/;

  const box = document.getElementById("now-playing");
  const calm = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  new p5((p) => {
    let track = null, pending = undefined;  // pending: a new track waiting for the current scroll to finish
    let text = { lit: [], width: 0 };       // marquee text rendered to an on/off grid
    let offset = 0, clockShown = "";
    let art = [], oldArt = [], changedAt = 0;
    let layout, visible = true;

    p.setup = () => {
      p.pixelDensity(1);
      p.frameRate(30);
      p.createCanvas(10, 10).parent(box);
      resize();
      showTrack(null, []);
      // Size from the box itself, so the canvas follows it even when the window doesn't resize
      new ResizeObserver(resize).observe(box);
      // Don't animate or poll while the box is scrolled out of view
      new IntersectionObserver(([e]) => {
        visible = e.isIntersecting;
        visible ? p.loop() : p.noLoop();
      }).observe(box);
      poll();
      setInterval(poll, POLL_SECONDS * 1000);
    };

    function resize() {
      const w = Math.max(box.clientWidth - 32, 100);  // minus the box's padding
      const h = Math.round(w * 0.32);
      p.resizeCanvas(w, h);
      const marqueePitch = h / 2 / ROWS;
      layout = {
        artPitch: h / ART_DOTS,
        marqueeX: h + h * 0.08,
        marqueeY: (h - ROWS * marqueePitch) / 2,
        marqueePitch,
        cols: Math.floor((w - h * 1.08) / marqueePitch),
      };
      startText();
    }

    async function poll() {
      if (!visible || document.hidden) return;
      let next = null;
      try {
        const data = await (await fetch(RELAY_URL)).json();
        if (data.playing) next = { song: String(data.song), artist: String(data.artist), art: data.art };
      } catch {
        // Relay unreachable: show the clock, like the real ticker does
      }
      if (sameTrack(next, pending === undefined ? track : pending)) return;
      const dots = next ? await coverDots(next.art) : [];
      // Switch at the end of the current scroll, or right away if nothing is scrolling
      if (track && !calm) pending = { next, dots };
      else showTrack(next, dots);
    }

    function sameTrack(a, b) {
      return (a && a.song) === (b && b.song) && (a && a.artist) === (b && b.artist);
    }

    function showTrack(next, dots) {
      track = next;
      pending = undefined;
      oldArt = art;
      art = dots;
      changedAt = p.frameCount;
      startText();
      box.setAttribute("aria-label", track ? `Now playing: ${track.song} by ${track.artist}` : "Nothing playing right now");
    }

    function startText() {
      if (!layout) return;
      clockShown = clockText();
      const label = track ? `${NOTE} ${tickerText(track.song) || "?"} - ${tickerText(track.artist) || "?"}` : clockShown;
      text = renderText(label);
      // Songs scroll in from the right; otherwise centre the text, or show its start if it's too long
      offset = track && !calm ? -layout.cols : Math.min(0, -Math.floor((layout.cols - text.width) / 2));
    }

    function clockText() {
      const now = new Date();
      return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
    }

    // Same as the Pi ticker: the font only has basic characters, so respell and strip accents (Beyoncé -> Beyonce).
    // Respelled before stripping accents (й -> y, not i) and after (½ splits into 1⁄2, Hangul into letters).
    function toAscii(s) {
      const respell = (t) => t.replace(SPELLING_PATTERN, (m) => SPELLINGS[m]);
      return respell(respell(s).normalize("NFKD")).replace(/[^\x20-\x7e]/g, "");
    }

    // What the marquee shows: CP437 text, with any Japanese/Chinese runs kept as they are
    function tickerText(s) {
      return s.normalize("NFC").split(CJK).map((run, i) => (i % 2 ? run : toAscii(run))).join("").trim();
    }

    // One character's columns as row bitmasks (bit r = marquee row r), trimmed like luma's
    // proportional(): blank edges cut, one gap column after
    const systemGlyphs = new Map();
    function glyph(ch) {
      if (ch === " ") return [0, 0, 0, 0];
      let cols;
      if (FONT_CHARS.includes(ch)) {
        const top = Math.ceil((ROWS - 8) / 2);  // the 8-row font, centred vertically
        cols = FONT_DATA[FONT_CHARS.indexOf(ch)].match(/../g).map((h) => parseInt(h, 16) << top);
      } else {
        if (!systemGlyphs.has(ch)) systemGlyphs.set(ch, systemGlyph(ch));
        cols = systemGlyphs.get(ch);
      }
      const first = cols.findIndex((c) => c !== 0);
      if (first < 0) return [0];
      const last = cols.length - [...cols].reverse().findIndex((c) => c !== 0);
      return [...cols.slice(first, last), 0];
    }

    // A character the font doesn't have, drawn small in the visitor's fonts and kept where clearly lit.
    // Each character is drawn on its own from a whole pixel, so it always lights the same dots.
    function systemGlyph(ch) {
      const g = p.createGraphics(ROWS * 2, ROWS);
      g.pixelDensity(1);
      g.textFont("Arial");
      g.textStyle(p.BOLD);
      g.textSize(ROWS * 1.05);
      g.fill(255);
      g.noStroke();
      g.textAlign(p.LEFT, p.BASELINE);
      g.text(ch, 0, ROWS - 2);
      g.loadPixels();
      const cols = [];
      for (let x = 0; x < ROWS * 2; x++) {
        let bits = 0;
        for (let r = 0; r < ROWS; r++) if (g.pixels[(r * ROWS * 2 + x) * 4 + 3] > 120) bits |= 1 << r;
        cols.push(bits);
      }
      g.remove();
      return cols;
    }

    // The label as an on/off grid, ROWS tall
    function renderText(label) {
      const cols = [...label].flatMap(glyph);
      const width = cols.length;
      const lit = new Array(width * ROWS).fill(false);
      cols.forEach((bits, x) => {
        for (let r = 0; r < ROWS; r++) if ((bits >> r) & 1) lit[r * width + x] = true;
      });
      return { lit, width };
    }

    // The album cover sampled down to the LED grid; unlit if it's missing or not from Spotify
    function coverDots(url) {
      return new Promise((resolve) => {
        if (typeof url !== "string" || !url.startsWith(ART_HOST)) return resolve([]);
        p.loadImage(url, (img) => {
          img.resize(ART_DOTS, ART_DOTS);
          const dots = [];
          for (let y = 0; y < ART_DOTS; y++) {
            for (let x = 0; x < ART_DOTS; x++) dots.push(img.get(x, y));
          }
          resolve(dots);
        }, () => resolve([]));
      });
    }

    p.draw = () => {
      p.background(BG);
      drawArt();
      drawMarquee();

      if (track && !calm) {
        offset += SCROLL_SPEED;
        if (offset > text.width) {
          if (pending !== undefined) showTrack(pending.next, pending.dots);
          else offset = -layout.cols;
        }
      } else if (pending !== undefined) {
        showTrack(pending.next, pending.dots);
      } else if (!track && clockText() !== clockShown) {
        startText();  // keep the clock current
      }
    };

    function drawArt() {
      const { artPitch } = layout;
      const age = p.frameCount - changedAt;
      p.noStroke();
      for (let y = 0; y < ART_DOTS; y++) {
        for (let x = 0; x < ART_DOTS; x++) {
          // New cover ripples outward from the centre
          const dist = Math.hypot(x - ART_DOTS / 2, y - ART_DOTS / 2);
          const since = calm ? Infinity : age - dist * 1.2;
          const dots = since >= 0 ? art : oldArt;
          const pop = since >= 0 && since < 10 ? 1 + 0.35 * (1 - since / 10) : 1;
          p.fill(dots.length ? dots[y * ART_DOTS + x] : ART_OFF);
          p.circle((x + 0.5) * artPitch, (y + 0.5) * artPitch, artPitch * 0.82 * pop);
        }
      }
    }

    function drawMarquee() {
      const { marqueeX, marqueeY, marqueePitch, cols } = layout;
      const start = Math.floor(offset);
      p.noStroke();
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < cols; c++) {
          const tx = start + c;
          const on = tx >= 0 && tx < text.width && text.lit[r * text.width + tx];
          p.fill(on ? LED_ON : LED_OFF);
          p.circle(marqueeX + (c + 0.5) * marqueePitch, marqueeY + (r + 0.5) * marqueePitch, marqueePitch * 0.8);
        }
      }
    }
  }, box);
})();
</script>
